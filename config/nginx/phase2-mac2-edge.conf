# Phase 2 — PRIMARY nginx edge on Mac 2 (Tanisha, 10.7.19.91)
# Goes in the http {} block of /opt/homebrew/etc/nginx/nginx.conf
# Apply: nginx -t && nginx -s reload
#
# Changes from Phase 1:
#   - max_fails / fail_timeout + proxy_next_upstream  -> explicit failover (Extension D)
#   - Backend B via 127.0.0.1 (local), so pf rules on en0 never block the edge (Extension C)
#   - http2 on                                        -> HTTP/2 demo (needs nginx >= 1.25.1)
#   - X-Edge header                                   -> shows which edge answered (Extension E)
upstream backend_servers {
    server 10.7.2.116:3001 max_fails=1 fail_timeout=10s;   # Backend A (Mac 1)
    server 127.0.0.1:3002   max_fails=1 fail_timeout=10s;   # Backend B (local)
}

server {
    listen 8443 ssl;
    http2 on;
    server_name app.team1.test api.team1.test;

    ssl_certificate     /Users/tanisha/cn-project/certs/team1.crt;
    ssl_certificate_key /Users/tanisha/cn-project/certs/team1.key;

    access_log /tmp/team1-edge-access.log;
    error_log  /tmp/team1-edge-error.log;

    location / {
        proxy_pass http://backend_servers;

        proxy_connect_timeout 2s;
        proxy_read_timeout    5s;
        proxy_next_upstream   error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        add_header X-Edge "mac2-primary" always;
    }
}
