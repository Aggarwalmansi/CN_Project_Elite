# Phase 1 — nginx edge on Mac 2 (as captured from the running nginx.conf, report Appendix A)
upstream backend_servers {
    server 10.7.21.182:3001;   # Backend A (Mac 1)
    server 10.7.21.206:3002;   # Backend B (Mac 2)
}

server {
    listen 8443 ssl;
    server_name app.team1.test;

    ssl_certificate     /Users/tanisha/cn-project/certs/team1.crt;
    ssl_certificate_key /Users/tanisha/cn-project/certs/team1.key;

    access_log /tmp/team1-nginx-access.log;
    error_log  /tmp/team1-nginx-error.log;

    location / {
        proxy_pass http://backend_servers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
