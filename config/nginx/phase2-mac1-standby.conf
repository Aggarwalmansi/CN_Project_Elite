# Phase 2 — STANDBY nginx edge on Mac 1 (Mansi, 10.7.2.116)   (Extension E)
# Install to: /opt/homebrew/etc/nginx/servers/team1-standby.conf   then: nginx -t && nginx
# Uses the SAME certificate/key as the primary edge (copy via AirDrop, never via git).
# Replace <mansi-username> with the real macOS username.
upstream backend_servers {
    server 127.0.0.1:3001   max_fails=1 fail_timeout=10s;   # Backend A (local)
    server 10.7.19.91:3002 max_fails=1 fail_timeout=10s;   # Backend B (Mac 2)
}

server {
    listen 8443 ssl;
    http2 on;
    server_name app.team1.test api.team1.test;

    ssl_certificate     /Users/<mansi-username>/cn-project/certs/team1.crt;
    ssl_certificate_key /Users/<mansi-username>/cn-project/certs/team1.key;

    access_log /tmp/team1-standby-access.log;
    error_log  /tmp/team1-standby-error.log;

    location / {
        proxy_pass http://backend_servers;
        proxy_connect_timeout 2s;
        proxy_next_upstream   error timeout http_502 http_503 http_504;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        add_header X-Edge "mac1-standby" always;
    }
}
