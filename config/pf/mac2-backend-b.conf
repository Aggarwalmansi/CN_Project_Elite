# Extension C — Mac 2 (Tanisha): Backend B (3002) unreachable from the LAN.
# nginx reaches Backend B over loopback (127.0.0.1), which these en0 rules never touch.
# Loaded into an anchor under Apple's ruleset, so /etc/pf.conf is never modified.
#
#   sudo pfctl -sr > ~/pf-backup-$(date +%F).txt      # rollback copy of current rules
#   sudo pfctl -E                                      # note the token it prints
#   sudo pfctl -a com.apple/team1 -f config/pf/mac2-backend-b.conf
#   sudo pfctl -a com.apple/team1 -vsr                 # show rules + hit counters
# Rollback:
#   sudo pfctl -a com.apple/team1 -F rules && sudo pfctl -X <token>
#
# NOTE: remove this rule before Extension E — the standby edge on Mac 1 needs 3002.
block in quick on en0 proto tcp from any to any port 3002
