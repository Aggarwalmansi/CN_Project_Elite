# Phase 2 — PRIMARY DNS on Mac 1 (Mansi, 10.7.21.182)
# Install to: /opt/homebrew/etc/dnsmasq.conf   then: sudo brew services restart dnsmasq
#
# Change from Phase 1: address= always answers with TTL 0, which makes the
# Extension B / E TTL demos impossible. host-record=<name>,<ip>,<ttl> gives a
# visible 30 s TTL.
port=53
listen-address=127.0.0.1,10.7.21.182
bind-interfaces

host-record=app.team1.test,10.7.21.206,30
host-record=api.team1.test,10.7.21.206,30
local-ttl=30

server=1.1.1.1
server=8.8.8.8
cache-size=150

log-queries
log-facility=/tmp/team1-dns.log
