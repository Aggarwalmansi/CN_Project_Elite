# Phase 2 — BACKUP DNS on Mac 2 (Tanisha, 10.7.19.91)   (Extension A)
# Install to: /opt/homebrew/etc/dnsmasq.conf   then: sudo brew services start dnsmasq
# Records must stay identical to the primary (phase2-mac1-primary.conf).
port=53
listen-address=127.0.0.1,10.7.19.91
bind-interfaces

host-record=app.team1.test,10.7.19.91,30
host-record=api.team1.test,10.7.19.91,30
local-ttl=30
# Do not serve /etc/hosts — only the records above (a stale hosts entry leaked in once)
no-hosts

server=1.1.1.1
server=8.8.8.8
cache-size=150

log-queries
log-facility=/tmp/team1-dns-backup.log
